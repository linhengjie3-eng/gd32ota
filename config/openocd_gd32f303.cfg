# ============================================================================
# GD32F303VGT6 + DAPLink (CMSIS-DAP) 专用 OpenOCD 配置
# 由 tools/build.py 的 flash-* / probe 命令自动加载，不用手敲参数。
# 依赖：OpenOCD 的 scripts 目录由 build.py 通过 -s 自动传入。
# ============================================================================

# ---------------------------------------------------------------- 调试器
adapter driver cmsis-dap

# 本机实测（2026-11-19）：Flash Pro(CMSIS-DAP) v2，VID_0D28:PID_0204，FW 2.2.0，
# 复合设备含 HID 接口；backend hid 与 auto 都能连上芯片，bulk 参数本版 OpenOCD 不支持。
# 用 auto 兼容 HID(v1) / WinUSB(v2) 两类调试器，换设备不用改这里。
cmsis-dap backend auto

# 若换调试器后报 "unable to find a matching CMSIS-DAP device"，可显式锁定 VID/PID：
# cmsis-dap vid_pid 0x0d28 0x0204     (Flash Pro v2 / 本机)
# cmsis-dap vid_pid 0xc251 0xf001     (旧 DAPLink / 立创地阔星类)

transport select swd
adapter speed 1000

# ---------------------------------------------------------------- 目标芯片
# GD32F303VGT6 = Cortex-M4F，SW-DP IDCODE = 0x2BA01477。
# 官方 target/stm32f1x.cfg 默认按 Cortex-M3 的 0x1BA01477 校验，
# 不覆盖这一项会直接报 "expected 1 of 1: 0x1ba01477" 连不上。
set CPUTAPID 0x2ba01477
source [find target/stm32f1x.cfg]

# GD32F30x 的 FMC 与 STM32F1 兼容，OpenOCD 的 stm32f1x 驱动官方明确支持
# GD32F3 系列。但该驱动对 GD32 的 Flash 容量常探测不准（常报 512 KiB），
# 所以 build.py 只烧 factory.bin 的前 512 KiB —— Boot + 元数据 + App-A
# 全落在这个范围内，Slot B 保持擦除态（0xFF）本来就是我们要的状态。
